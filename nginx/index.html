<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>isinha a braba</title>
<style>
  body {
    background: #FF1493;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-shadow: 2px 2px 8px #C71585;
  }
  h1 { font-size: 3em; text-align: center; }
  .sparkle {
    position: fixed;
    font-size: 2em;
    animation: brilhar 1.5s infinite alternate;
  }
  @keyframes brilhar {
    from { opacity: 0.2; transform: scale(0.8) rotate(0deg); }
    to   { opacity: 1;   transform: scale(1.3) rotate(20deg); }
  }
</style>
</head>
<body>
  <h1>✨ servidor NGINX 8080 ✨<br>isinha a braba</h1>
  <span class="sparkle" style="top:10%; left:15%;">✨</span>
  <span class="sparkle" style="top:20%; left:80%; animation-delay:0.3s;">🌟</span>
  <span class="sparkle" style="top:70%; left:10%; animation-delay:0.6s;">✨</span>
  <span class="sparkle" style="top:80%; left:75%; animation-delay:0.9s;">🌟</span>
  <span class="sparkle" style="top:45%; left:90%; animation-delay:1.2s;">✨</span>
  <span class="sparkle" style="top:15%; left:45%; animation-delay:0.4s;">💫</span>
  <span class="sparkle" style="top:85%; left:40%; animation-delay:0.8s;">✨</span>
</body>
</html>
